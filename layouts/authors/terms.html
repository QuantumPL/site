{{- define "main" -}}

{{/* List of all authors. */}}

{{ partial "page_header.html" . }}

<div class="universal-wrapper">
  {{ with .Content }}
  <div class="article-style">{{ . }}</div>
  {{ end }}

  Sorted alphabetically:

  <ul>
    {{ range sort (where .Data.Pages "Title" "!=" "Kartik") "Title" }}
      <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>

</div>

{{- end -}}
